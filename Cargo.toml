[package]
name = "cctvpro"
version = "0.1.0"
edition = "2024"

[dependencies]
ffmpeg-next = "=9.0.0"
ort = { version = "=2.0.0-rc.15", features = ["ndarray"] }
ndarray = "=0.17.2"
minifb = "=0.29.0"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[features]
cuda = ["ort/cuda"]

[profile.release]
debug = false
